# Process documentation for the agents in github.com/avinashbarnwal/ai-cfo
# Rendered by _pages/ai-cfo-agents.html. One entry per agent; edit here, not in the page.

- domain: "Order to Cash"
  slug: o2c
  folder: order_to_cash_agent
  intro: "From the credit decision on an order to cash landing against the invoice: who can buy, what gets billed, who gets chased, and how receipts and short-payments are cleared."
  agents:
    - name: "Credit Management Agent"
      module: "order_to_cash_agent.credit.agent"
      summary: "Scores every customer, recommends a credit limit and decides whether pending orders ship."
      inputs: "Customer master: annual revenue, average days-to-pay, payment terms, bureau score, current limit, open AR, pending order value."
      steps:
        - "Compute days paid late = average days-to-pay minus terms (floored at 0, capped at 60)."
        - "Score 0–100: 40 pts bureau score (300–850 scaled), 35 pts payment timeliness, 25 pts company size (log of revenue, capped at $500M)."
        - "Bucket into risk class: below 45 High, 45–65 Medium, 65–80 Low, 80+ Minimal."
        - "Recommended limit = annual revenue × 0.2% × score / 100, rounded to the nearest $1k."
        - "Order decision: if open AR + pending order fits within the limit → Release; otherwise High risk → Hold for credit review, anything else → Release with approval."
      outputs: "Scored customer table with recommended limit and order decision; count of holds and limit changes."
      human: "Credit manager approves holds and limit changes."
      llm: "Credit review memo for the weakest customer."
      flow:
        - {"t": "in", "label": "Customer master + open AR"}
        - {"t": "step", "label": "Score 0–100: bureau 40 · timeliness 35 · size 25"}
        - {"t": "step", "label": "Risk class + limit = revenue × 0.2% × score"}
        - {"t": "decide", "label": "Open AR + order ≤ limit?", "branches": ["Yes → Release", "No, High risk → Hold", "No, other → Release w/ approval"]}
        - {"t": "llm", "label": "Credit review memo"}
        - {"t": "human", "label": "Credit manager approves"}

    - name: "e-Invoicing Portal Agent"
      module: "order_to_cash_agent.einvoicing.agent"
      summary: "Checks outgoing invoices against e-invoice rules and routes each to the right government or customer channel."
      inputs: "Outgoing invoices: customer, country, buyer tax ID, PO number, line total, tax rate, tax amount."
      steps:
        - "Check mandatory fields: buyer tax ID, PO number, line total, tax rate."
        - "Recompute tax (line total × rate) and flag a mismatch above 1 cent."
        - "Flag zero-rated non-US invoices that need an exemption code."
        - "Mark each invoice Ready or Blocked with its list of errors."
        - "Pick the channel by country: DE Peppol, FR Chorus Pro / PDP, IN GST IRP (IRN + QR), IT SdI, US customer AP portal or email PDF."
        - "Build a UBL-style JSON payload for Ready invoices."
      outputs: "Invoice list with status, channel and errors; ready vs blocked counts."
      human: "Billing fixes blocked invoices before resubmission."
      llm: ""
      flow:
        - {"t": "in", "label": "Outgoing invoices"}
        - {"t": "step", "label": "Check mandatory fields"}
        - {"t": "step", "label": "Recompute tax · exemption code"}
        - {"t": "decide", "label": "Any errors?", "branches": ["No → Ready", "Yes → Blocked"]}
        - {"t": "step", "label": "Route by country: Peppol · SdI · GST IRP · Chorus Pro · portal"}
        - {"t": "out", "label": "UBL-style payload"}
        - {"t": "human", "label": "Billing fixes blocked"}

    - name: "Collections Management Agent"
      module: "order_to_cash_agent.collections.agent"
      summary: "Turns open AR into a risk-ranked daily worklist and drafts the outreach."
      inputs: "Open invoices: customer, due date, open amount."
      steps:
        - "Keep open invoices and compute days past due."
        - "Roll up per customer: open AR, past-due amount, max days past due, number of open invoices."
        - "Risk score = 0.5 × past-due share (vs worst customer) + 0.4 × max days past due (normalised) + 0.1 × invoice count (normalised)."
        - "Pick a strategy from max days past due: over 60 escalate (call + credit-hold review), over 30 collector call, over 0 friendly email, otherwise pre-due courtesy note."
        - "Sort the worklist by risk score and draft a dunning email for the top customer."
      outputs: "Collector worklist with risk score and strategy; total open AR, total past due, % past due."
      human: "Collector reviews and sends the email, works the list."
      llm: "Dunning email for the highest-risk customer."
      flow:
        - {"t": "in", "label": "Open invoices"}
        - {"t": "step", "label": "Days past due"}
        - {"t": "step", "label": "Roll up per customer"}
        - {"t": "step", "label": "Risk score: exposure × delinquency"}
        - {"t": "decide", "label": "Max days past due", "branches": ["> 60 → Escalate + credit hold", "> 30 → Collector call", "> 0 → Friendly email", "0 → Courtesy note"]}
        - {"t": "llm", "label": "Dunning email"}
        - {"t": "human", "label": "Collector sends"}

    - name: "Cash Application Agent"
      module: "order_to_cash_agent.cash_application.agent"
      summary: "Matches incoming receipts to open invoices with a cascade of increasingly fuzzy rules."
      inputs: "Open invoices; bank receipts with payer name, amount and remittance reference."
      steps:
        - "Reference match: if the remittance cites invoice IDs, apply to those invoices."
        - "Otherwise identify the customer by fuzzy match of payer name to the customer list."
        - "Amount match: look for one, two or three of that customer's open invoices that sum to the receipt (within $0.01)."
        - "Remove matched invoices from the open pool so they can't be applied twice."
        - "Anything still unmatched is a short-pay or unknown payment → exception queue for Deductions."
      outputs: "Receipt-to-invoice matches with method and confidence; auto-match rate; exception count."
      human: "Cash app analyst works the exception queue."
      llm: ""
      flow:
        - {"t": "in", "label": "Bank receipts + open invoices"}
        - {"t": "decide", "label": "Invoice ref in remittance?", "branches": ["Yes → Apply", "No → Next step"]}
        - {"t": "step", "label": "Fuzzy-match payer to customer"}
        - {"t": "decide", "label": "1–3 invoices sum to amount?", "branches": ["Yes → Apply", "No → Exception"]}
        - {"t": "out", "label": "Matches + auto-match rate"}
        - {"t": "human", "label": "Analyst works exceptions"}

    - name: "Deductions Management Agent"
      module: "order_to_cash_agent.deductions.agent"
      summary: "Codes customer short-payments, checks them against backup, and decides to clear, dispute or write off."
      inputs: "Deductions with memo text and amount; whether a promo agreement exists; whether proof of delivery was signed clean."
      steps:
        - "Classify the memo by keyword into promo, pricing, shortage, damage, freight, compliance or unknown."
        - "Promo: valid if a promo agreement exists, otherwise invalid."
        - "Shortage or damage: invalid if the POD was signed clean, otherwise valid."
        - "Compliance fines (late delivery, ASN, labels): dispute and request retailer backup."
        - "Anything else under $100: auto write-off. Otherwise route to an analyst for research."
        - "Map each decision to the next action: clear against accrual, send dispute with POD/contract, request backup, route, or write off."
      outputs: "Coded deductions with decision and next action; count and value by decision."
      human: "Analyst researches open items and approves disputes."
      llm: "Dispute letter for an invalid deduction, citing the evidence."
      flow:
        - {"t": "in", "label": "Deductions + backup docs"}
        - {"t": "step", "label": "Classify memo: promo · pricing · shortage · damage · freight · compliance"}
        - {"t": "decide", "label": "Backup supports it?", "branches": ["Promo + agreement → Valid", "Shortage/damage + clean POD → Invalid", "Compliance fine → Dispute", "Under $100 → Write off", "Else → Research"]}
        - {"t": "llm", "label": "Dispute letter"}
        - {"t": "human", "label": "Analyst approves disputes"}

- domain: "Accounts Payable"
  slug: ap
  folder: accounts_payable_agent
  intro: "From a supplier joining, to their invoice being matched, to the cash leaving: onboarding risk, three-way match and an optimised payment run."
  agents:
    - name: "Supplier Portal Agent"
      module: "accounts_payable_agent.supplier_portal.agent"
      summary: "Answers suppliers' payment-status questions and screens new suppliers before they're set up."
      inputs: "AP ledger (invoice, status, pay date); supplier questions; onboarding records (tax form, recent bank change, email domain match)."
      steps:
        - "Pull the invoice number out of each supplier question and look up its status and payment date."
        - "Answer the supplier in one or two sentences."
        - "Screen onboarding: sanctions-list hit → Block."
        - "Bank details changed in the last 30 days and the email domain doesn't match → Hold for call-back verification."
        - "Missing tax form → Hold. No flags → Approve."
      outputs: "Answered queries; onboarding decisions with risk flags."
      human: "AP verifies held suppliers by phone before approval."
      llm: "Help-desk answers to supplier questions."
      flow:
        - {"t": "in", "label": "Supplier queries + onboarding"}
        - {"t": "step", "label": "Look up invoice status + pay date"}
        - {"t": "llm", "label": "Help-desk answer"}
        - {"t": "decide", "label": "Onboarding screen", "branches": ["Sanctions hit → Block", "Bank change + domain mismatch → Hold", "No tax form → Hold", "Clean → Approve"]}
        - {"t": "human", "label": "Call-back verification"}

    - name: "AP Automation Agent"
      module: "accounts_payable_agent.ap_automation.agent"
      summary: "Captures invoice fields, runs a three-way match and codes the GL so clean invoices post untouched."
      inputs: "Invoice text; purchase orders (quantity, unit price); goods receipts (quantity received)."
      steps:
        - "Extract vendor, invoice number, PO, quantity and unit price from invoice text (regex stand-in for OCR or LLM extraction)."
        - "Join each invoice to its PO and goods receipt."
        - "Repeat vendor + invoice number → Reject as duplicate."
        - "Price more than 2% off the PO → Exception: price variance."
        - "Billed quantity above quantity received → Exception: qty > received."
        - "Otherwise Matched → post, with the GL account taken from the vendor's default coding."
      outputs: "Invoice table with GL account, price variance and status; touchless %, exceptions, duplicates."
      human: "Buyer resolves price and quantity exceptions."
      llm: "Exception summary for the AP manager with next steps."
      flow:
        - {"t": "in", "label": "Invoice text + PO + goods receipt"}
        - {"t": "step", "label": "Extract fields"}
        - {"t": "step", "label": "Join PO + receipt"}
        - {"t": "decide", "label": "Three-way match", "branches": ["Duplicate → Reject", "Price > 2% → Exception", "Qty > received → Exception", "Match → Post"]}
        - {"t": "step", "label": "GL code by vendor"}
        - {"t": "llm", "label": "Exception summary"}
        - {"t": "human", "label": "Buyer resolves"}

    - name: "Vendor Payments Agent"
      module: "accounts_payable_agent.vendor_payments.agent"
      summary: "Builds the payment run: takes discounts that beat the cost of cash, picks the rail, and stops at available cash."
      inputs: "Approved invoices with due date and early-pay discount terms; cash available for the run."
      steps:
        - "Annualise each discount: rate / (1 − rate) × 365 / days paid early."
        - "Capture the discount if it beats the 8% cost of cash and the discount date hasn't passed."
        - "Include invoices due within the next 7 days; defer everything else."
        - "Choose the rail: international → wire, card-accepting vendors → virtual card (rebate), otherwise ACH."
        - "Order discounts first (highest return first), then due items, and add to the run until available cash runs out."
      outputs: "Payment run with amount, reason, rail and in-run flag; discounts captured, rail mix, items deferred for cash."
      human: "Treasury or the controller approves the run before release."
      llm: ""
      flow:
        - {"t": "in", "label": "Approved invoices + cash"}
        - {"t": "step", "label": "Annualise discounts"}
        - {"t": "decide", "label": "Pay now?", "branches": ["Discount APR > 8% → Take discount", "Due ≤ 7 days → Pay", "Else → Defer"]}
        - {"t": "step", "label": "Rail: wire · virtual card · ACH"}
        - {"t": "decide", "label": "Fits available cash?", "branches": ["Yes → In run", "No → Deferred"]}
        - {"t": "human", "label": "Approve run"}

- domain: "Close & Reconciliation"
  slug: close
  folder: close_reconciliation_agent
  intro: "Month-end orchestration plus the reconciliations that feed it, from daily revenue to balance-sheet sign-off and intercompany."
  agents:
    - name: "Daily Revenue Reconciliation Agent"
      module: "close_reconciliation_agent.daily_revenue_reconciliation.agent"
      summary: "Ties orders to processor settlements to bank deposits every day, per processor."
      inputs: "Per day and processor: gross orders, contracted fee rate, settlement net, bank deposit."
      steps:
        - "Expected net = gross orders × (1 − contracted fee rate)."
        - "Fee variance = settlement net − expected net; deposit gap = bank deposit − settlement net."
        - "No settlement file → Missing settlement file."
        - "No deposit → Deposit not received (likely timing)."
        - "Fee variance above $50 → Fee / chargeback variance. Otherwise Matched."
      outputs: "Exception lines only; match rate, gross revenue, unexplained fee variance."
      human: "Revenue accountant chases missing files and disputes fees."
      llm: ""
      flow:
        - {"t": "in", "label": "Orders · settlements · deposits"}
        - {"t": "step", "label": "Expected net = gross × (1 − fee)"}
        - {"t": "decide", "label": "Ties out?", "branches": ["No file → Missing settlement", "No deposit → Timing", "Fee var > $50 → Fee variance", "Else → Matched"]}
        - {"t": "out", "label": "Exceptions + match rate"}
        - {"t": "human", "label": "Chase files, dispute fees"}

    - name: "Balance Sheet Reconciliation Agent"
      module: "close_reconciliation_agent.balance_sheet_reconciliation.agent"
      summary: "Compares the GL to supporting balances, explains variances and auto-certifies low-risk accounts."
      inputs: "GL balance and supporting balance (sub-ledger, bank, external) per account; open reconciling items."
      steps:
        - "Variance = supporting balance − GL balance."
        - "Subtract known reconciling items to get the unexplained variance."
        - "Risk-rate accounts: cash, intercompany and deferred revenue High; balances over $1M Medium; else Low."
        - "Zero variance and not High → Auto-certified. Zero variance and High → reviewer sign-off."
        - "Unexplained under $1,000 → reviewer sign-off. $1,000 or more → Exception: investigate."
      outputs: "Reconciliation table with explained/unexplained variance, risk and status."
      human: "Reviewer signs off; accountant books adjusting entries for exceptions."
      llm: "Explanation of exceptions and suggested adjusting entries."
      flow:
        - {"t": "in", "label": "GL vs supporting balances"}
        - {"t": "step", "label": "Variance − reconciling items"}
        - {"t": "step", "label": "Risk-rate the account"}
        - {"t": "decide", "label": "Unexplained variance", "branches": ["0, not High → Auto-certify", "0, High risk → Sign-off", "Under $1k → Sign-off", "$1k+ → Investigate"]}
        - {"t": "llm", "label": "Explain + adjusting entries"}
        - {"t": "human", "label": "Reviewer signs off"}

    - name: "Intercompany Management Agent"
      module: "close_reconciliation_agent.intercompany.agent"
      summary: "Matches intercompany balances between entity pairs in USD and proposes monthly net settlement."
      inputs: "Intercompany AR and AP by entity pair in local currency."
      steps:
        - "Translate every balance to USD."
        - "Pair each creditor's AR with the debtor's AP for the same entity pair."
        - "Status: missing AP booking, missing AR booking, matched (difference under $100) or amount mismatch."
        - "Net each entity's receivables against its payables."
        - "Positive net → receive from the netting centre; negative → pay the netting centre."
      outputs: "Pair-level match table; netting positions; gross vs net settlement and % reduction."
      human: "Entity accountants fix unmatched bookings before eliminations."
      llm: ""
      flow:
        - {"t": "in", "label": "IC AR / AP by entity"}
        - {"t": "step", "label": "Translate to USD"}
        - {"t": "step", "label": "Pair AR ↔ AP"}
        - {"t": "decide", "label": "Match?", "branches": ["One side missing → Book it", "Diff < $100 → Matched", "Else → Mismatch"]}
        - {"t": "step", "label": "Net per entity"}
        - {"t": "out", "label": "Pay / receive netting centre"}
        - {"t": "human", "label": "Fix bookings"}

    - name: "Financial Close Agent"
      module: "close_reconciliation_agent.financial_close.agent"
      summary: "Runs the close checklist as a dependency graph, finds the critical path, and books accruals."
      inputs: "Close tasks with dependencies, duration and status; received-not-invoiced (GRNI) items; current close day."
      steps:
        - "Compute each task's planned finish day from its dependencies and duration."
        - "Flag tasks as late if their planned finish has passed and they aren't done."
        - "List what is blocking each task (unfinished dependencies)."
        - "Walk back from the last-finishing task to get the critical path and projected close day."
        - "Turn GRNI into an accrual journal: debit the expense GL, credit 2100 Accrued Liabilities."
      outputs: "Task table with planned finish, blockers and late flag; critical path; accrual journal."
      human: "Controller unblocks tasks and approves the accrual journal."
      llm: "Close status update for the Controller."
      flow:
        - {"t": "in", "label": "Close tasks + GRNI"}
        - {"t": "step", "label": "Plan finish from dependencies"}
        - {"t": "step", "label": "Flag late + blocked"}
        - {"t": "step", "label": "Critical path → close day"}
        - {"t": "out", "label": "Accrual journal"}
        - {"t": "llm", "label": "Close status update"}
        - {"t": "human", "label": "Controller approves"}

- domain: "Consolidation & Reporting"
  slug: reporting
  folder: consolidation_reporting_agent
  intro: "Rolls entity books into one set of group numbers, then explains them."
  agents:
    - name: "Financial Consolidation Agent"
      module: "consolidation_reporting_agent.financial_consolidation.agent"
      summary: "Translates, eliminates and consolidates entity trial balances into a group TB that balances."
      inputs: "Trial balances per entity in local currency; closing and average FX rates; ownership %."
      steps:
        - "Translate balance-sheet accounts at the closing rate and P&L accounts at the average rate."
        - "Plug each entity's translation difference to CTA in OCI."
        - "Aggregate all entities in USD."
        - "Eliminate IC receivable / payable and IC revenue / COGS; send any elimination difference to P&L."
        - "Compute non-controlling interest on partly owned entities (IN01, 80% owned)."
        - "Check the consolidated TB balances to zero."
      outputs: "Consolidated TB by entity with eliminations; IC difference, NCI share, consolidated net income."
      human: "Group reporting reviews eliminations and the IC difference."
      llm: ""
      flow:
        - {"t": "in", "label": "Entity TBs + FX rates"}
        - {"t": "step", "label": "Translate: BS closing · P&L average"}
        - {"t": "step", "label": "CTA to OCI"}
        - {"t": "step", "label": "Eliminate IC balances"}
        - {"t": "step", "label": "NCI on IN01 (80%)"}
        - {"t": "decide", "label": "TB balances?", "branches": ["Yes → Publish", "No → Review"]}
        - {"t": "human", "label": "Group reporting review"}

    - name: "Financial Reporting Agent"
      module: "consolidation_reporting_agent.financial_reporting.agent"
      summary: "Builds the monthly P&L flux report and drafts commentary without inventing causes."
      inputs: "P&L lines: actual, budget, prior month."
      steps:
        - "Compute variance to budget (amount and %) and to prior month."
        - "Flag a line only if both thresholds break: more than 3% and more than $50k."
        - "Mark favourable or unfavourable."
        - "Draft commentary for flagged lines; unknown drivers are written as 'driver TBC with owner'."
      outputs: "Flux table with flags; revenue vs budget %, EBITDA margin; draft commentary."
      human: "Line owners confirm drivers before the CFO pack goes out."
      llm: "CFO-pack commentary, told not to invent business drivers."
      flow:
        - {"t": "in", "label": "Actual · budget · prior month"}
        - {"t": "step", "label": "Variance $ and %"}
        - {"t": "decide", "label": "Over 3% and $50k?", "branches": ["Yes → Flag", "No → Skip"]}
        - {"t": "llm", "label": "Commentary, no invented drivers"}
        - {"t": "human", "label": "Owners confirm drivers"}

- domain: "Treasury & Risk"
  slug: treasury
  folder: treasury_risk_agent
  intro: "Where the cash is today, where it will be in 13 weeks, and whether today's outgoing payments are safe to release."
  agents:
    - name: "Cash Management Agent"
      module: "treasury_risk_agent.cash_management.agent"
      summary: "Builds the daily global cash position and proposes sweeps, top-ups and investment of idle cash."
      inputs: "Bank accounts per entity with balance, target and minimum (minimum = 50% of target); header account flag; group buffer ($5M)."
      steps:
        - "Translate balances to USD for the global position."
        - "Within each entity and currency, sweep any excess over target from non-header accounts to the header account."
        - "Fund any account below its minimum from the header account."
        - "Idle cash = global cash − buffer − sum of account targets."
        - "Propose idle cash for money-market fund or T-bill placement."
      outputs: "Proposed transfers; cash by entity; idle cash to invest."
      human: "Treasurer approves transfers and investments."
      llm: "Morning cash brief for the Treasurer."
      flow:
        - {"t": "in", "label": "Bank balances + targets"}
        - {"t": "step", "label": "Global USD position"}
        - {"t": "decide", "label": "Each account", "branches": ["Above target → Sweep to header", "Below minimum → Fund", "Else → Leave"]}
        - {"t": "step", "label": "Idle = cash − buffer − targets"}
        - {"t": "out", "label": "Invest idle: MMF / T-bills"}
        - {"t": "llm", "label": "Morning cash brief"}
        - {"t": "human", "label": "Treasurer approves"}

    - name: "Cash Forecasting Agent"
      module: "treasury_risk_agent.cash_forecasting.agent"
      summary: "Forecasts 13 weeks of cash by flow category and reports its own back-tested accuracy."
      inputs: "52 weeks of cash flows by category (AR receipts, other inflows, payroll, AP, rent, tax); opening cash."
      steps:
        - "Per category, forecast = the same week one season (26 weeks) earlier × a trend factor."
        - "Trend = mean of the last 26 weeks / prior 26, clipped to 0.8–1.2 (1.0 if the sign flipped)."
        - "Back-test: hold out the last 13 weeks, forecast them, report MAPE per category."
        - "Forecast the next 13 weeks, sum net flow, roll closing cash from the opening balance."
        - "Find the low point (week and balance)."
      outputs: "13-week forecast by category with net flow and closing cash; low point; back-test MAPE."
      human: "Treasury reviews the low point and any category with poor accuracy."
      llm: "Four-bullet CFO summary of the forecast."
      flow:
        - {"t": "in", "label": "52 weeks of flows + opening cash"}
        - {"t": "step", "label": "Seasonal-naive × trend per category"}
        - {"t": "step", "label": "Back-test last 13 weeks (MAPE)"}
        - {"t": "step", "label": "Forecast 13 weeks"}
        - {"t": "out", "label": "Closing cash + low point"}
        - {"t": "llm", "label": "CFO summary"}
        - {"t": "human", "label": "Review low point"}

    - name: "Treasury Payments Agent"
      module: "treasury_risk_agent.treasury_payments.agent"
      summary: "Screens every outgoing payment before release and routes it to the right approvers."
      inputs: "Payment batch (beneficiary, amount, bank-detail change flag); payment history per beneficiary; watchlist."
      steps:
        - "Score each payment against the beneficiary's history (z-score of log amount)."
        - "Watchlist hit → BLOCK."
        - "Same beneficiary and amount twice in the batch → HOLD: duplicate."
        - "Bank details changed → HOLD for call-back. |z| above 3 → HOLD: amount anomaly. Otherwise Clear."
        - "Approvers: up to $50k analyst; up to $500k analyst + manager; above that manager + CFO."
        - "Generate an ISO 20022 pain.001-style file for cleared payments."
      outputs: "Screened batch with anomaly score, decision and approvers; release value; pain.001 payload."
      human: "Named approvers release; holds are investigated first."
      llm: ""
      flow:
        - {"t": "in", "label": "Payment batch + history"}
        - {"t": "step", "label": "Anomaly z-score"}
        - {"t": "decide", "label": "Screen", "branches": ["Watchlist → Block", "Duplicate → Hold", "Bank change → Call-back", "|z| > 3 → Hold", "Else → Clear"]}
        - {"t": "step", "label": "Approvers by amount"}
        - {"t": "out", "label": "pain.001 file"}
        - {"t": "human", "label": "Approvers release"}

- domain: "B2B Payments"
  slug: b2b
  folder: b2b_payments_agent
  intro: "Accepting customer payments at the lowest cost: routing, surcharging and interchange qualification."
  agents:
    - name: "Payment Gateway Agent"
      module: "b2b_payments_agent.payment_gateway.agent"
      summary: "Routes each customer payment to the cheapest processor or rail that is likely to succeed."
      inputs: "Payments with amount, currency, preferred method, urgency, last decline code; processor fee, auth-rate and limit table."
      steps:
        - "Keep routes that support the currency and amount and match the customer's preferred method."
        - "Drop ACH for urgent payments."
        - "Pick the route with the lowest expected cost per successful payment = fee / auth rate (fallback: wire)."
        - "Set a retry plan from the decline code: insufficient funds → retry in 3 days; issuer unavailable → retry in 1h on another processor; do not honor → don't retry, ask for ACH."
      outputs: "Route, method, fee and retry plan per payment; savings vs sending everything by card."
      human: "Payments ops reviews the routing rules and retries."
      llm: ""
      flow:
        - {"t": "in", "label": "Payments + route table"}
        - {"t": "step", "label": "Filter eligible routes"}
        - {"t": "step", "label": "Pick min fee ÷ auth rate"}
        - {"t": "decide", "label": "Declined before?", "branches": ["Insufficient funds → Retry in 3d", "Issuer down → Alt processor", "Do not honor → Ask for ACH"]}
        - {"t": "out", "label": "Route + fee"}
        - {"t": "human", "label": "Ops reviews rules"}

    - name: "Surcharge Management Agent"
      module: "b2b_payments_agent.surcharge_management.agent"
      summary: "Decides whether a card payment can be surcharged, by how much, and writes the disclosure."
      inputs: "Card payments with amount, card type, US state and cost of acceptance."
      steps:
        - "Debit or prepaid card → no surcharge."
        - "State where surcharging is prohibited → no surcharge (the state list is illustrative)."
        - "Otherwise surcharge = the lower of the 3% network cap and the actual cost of acceptance."
        - "Generate customer-facing disclosure text."
      outputs: "Surcharge % and amount with reason; fees incurred vs recovered."
      human: "Legal confirms current state rules before go-live."
      llm: ""
      flow:
        - {"t": "in", "label": "Card payments"}
        - {"t": "decide", "label": "Surcharge allowed?", "branches": ["Debit / prepaid → No", "Prohibited state → No", "Else → Yes"]}
        - {"t": "step", "label": "Rate = min(3%, cost of acceptance)"}
        - {"t": "out", "label": "Disclosure text"}
        - {"t": "human", "label": "Legal confirms rules"}

    - name: "Interchange Fee Optimizer Agent"
      module: "b2b_payments_agent.interchange_fee_optimizer.agent"
      summary: "Adds Level 2/3 data to commercial-card transactions so they qualify for lower interchange."
      inputs: "Card transactions with flags for tax amount, PO and line items; whether the matching invoice is available."
      steps:
        - "Classify current data level: tax + PO + line items = L3; tax + PO = L2; else L1."
        - "Where the invoice is available, enrich the missing fields to reach L3."
        - "Price before and after at illustrative rates (L1 2.70%, L2 2.25%, L3 1.90%)."
      outputs: "Level before and after, fees and saving per transaction; total saving in $ and bps."
      human: "Payments ops reviews the enrichment mapping."
      llm: ""
      flow:
        - {"t": "in", "label": "Card transactions"}
        - {"t": "decide", "label": "Data level", "branches": ["Tax + PO + lines → L3", "Tax + PO → L2", "Else → L1"]}
        - {"t": "step", "label": "Enrich from invoice"}
        - {"t": "out", "label": "Fee saving (bps)"}
        - {"t": "human", "label": "Ops reviews mapping"}
